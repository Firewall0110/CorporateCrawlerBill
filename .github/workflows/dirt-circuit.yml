name: Dirt Circuit

# Scoped by path so it never runs for changes to the beat-em-up server in the repo root.
on:
  pull_request:
    paths: ['dirt-circuit/**', '.github/workflows/dirt-circuit.yml']
  push:
    branches: [main]
    paths: ['dirt-circuit/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: dirt-circuit

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fast, dependency-free, and catches the gross errors. Runs first so an unbalanced
      # `end` fails in seconds rather than after a toolchain install.
      - name: Structural Luau check
        run: python3 tools/luau_check.py src

      # The track gates. A track that cannot pass them must never reach the game, so the
      # generator is re-run in dry-run mode against the committed seed and must produce a
      # full pool with zero unresolvable slots.
      - name: Track gate harness
        run: python3 tools/trackgen/generate.py --count 30 --dry-run

      # Committed tracks must still pass today's gates — a gate tightened in a later commit
      # should fail here rather than in a player's race.
      - name: Validate committed tracks
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'tools/trackgen')
          manifest = json.loads(pathlib.Path('src/shared/Tracks/manifest.json').read_text())
          ids = {t['id'] for t in manifest['tracks']}
          files = {p.stem for p in pathlib.Path('src/shared/Tracks').glob('stadium_*.json')}
          assert ids == files, f'manifest/disk mismatch: {ids ^ files}'
          for p in sorted(pathlib.Path('src/shared/Tracks').glob('stadium_*.json')):
              d = json.loads(p.read_text())
              n = len(d['centerline'])
              assert len(d['halfWidth']) == n and len(d['elevation']) == n, p
              assert len(d['grid']) == 8, p
              assert len(d['checkpoints']) >= 8, p
              assert 1000 <= d['lapLength'] <= 1900, f'{p}: lap {d["lapLength"]}'
          print(f'{len(files)} committed tracks OK')
          PY

      # Installs the rokit BINARY. Its own tool-install step is a no-op for us: it discovers
      # a manifest with `find . -maxdepth 1`, which looks at the repo root, and ours lives in
      # dirt-circuit/. So the tools are installed explicitly in the next step.
      - name: Install rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install pinned tools
        run: rokit install --no-trust-check

      # ⚠️ This step is the fix for the bug that made the first run of this workflow red.
      #
      # The tool-install above previously ran at the repo root, found no manifest, installed
      # NOTHING, and still exited 0 in ten milliseconds. The lint steps were guarded on
      # `steps.rokit.outcome == 'success'`, which was true — so they ran anyway and died with
      # `selene: command not found`.
      #
      # That is LESSONS.md J-01 exactly: an indirect signal trusted without ever being
      # falsified. "The action succeeded" was never the same claim as "the tools exist", and
      # the guard tested the first while meaning the second. So now the check tests the
      # actual thing, by name.
      - name: Verify the toolchain really installed
        run: |
          missing=0
          for tool in selene stylua rojo; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH after 'rokit install'"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          selene --version
          stylua --version
          rojo --version

      # selene's `std = "roblox"` needs a generated API-dump std file; it is not built in.
      # Generated in CI rather than committed: it is large, and it tracks whatever the
      # current Roblox API is, which is what we want a lint run to check against.
      - name: Generate Roblox std for selene
        run: selene generate-roblox-std

      # These three are REQUIRED, not best-effort. A toolchain that cannot install must turn
      # CI red rather than quietly skipping the most valuable checks in the pipeline — an
      # inert mitigation that looks like it is working is worse than no mitigation, because
      # it also stops anyone looking. (Same failure shape as LESSONS.md I-02.)
      - name: Lint
        run: selene src

      - name: Format check
        run: stylua --check src

      # The real proof that the project tree assembles and every $path resolves.
      - name: Rojo build
        run: rojo build --output /tmp/dirt-circuit.rbxl
